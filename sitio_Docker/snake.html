<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Serpiente Multijugador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }
        .game-board-container {
            box-shadow: 0 0 20px 0px rgba(0, 255, 255, 0.5), 0 0 30px 0px rgba(255, 0, 255, 0.5);
            border: 2px solid #fff;
        }
        canvas {
            background-color: #000;
        }
        .score-card {
            background-color: rgba(30, 30, 30, 0.8);
            border: 2px solid #555;
            transition: all 0.3s ease;
        }
        .score-card.active-p1 {
            border-color: #39ff14;
            box-shadow: 0 0 15px #39ff14;
        }
        .score-card.active-p2 {
            border-color: #ff14c9;
            box-shadow: 0 0 15px #ff14c9;
        }
        .modal {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
        }
        .restart-btn {
            background-color: #fff;
            color: #000;
            transition: all 0.3s ease;
            border: 2px solid #fff;
        }
        .restart-btn:hover {
            background-color: #000;
            color: #fff;
            transform: scale(1.05);
        }
        .controls {
             background-color: rgba(30, 30, 30, 0.8);
             border: 2px solid #555;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <h1 class="text-4xl mb-4 text-center tracking-wider">Serpiente Multijugador</h1>

    <!-- Contenedor de Puntuaciones -->
    <div class="flex flex-col sm:flex-row justify-center gap-4 mb-4 w-full max-w-4xl">
        <div id="p1-score-card" class="score-card p-4 rounded-lg w-full text-center">
            <h2 class="text-xl">Jugador 1</h2>
            <p class="text-3xl" id="score1">0</p>
        </div>
        <div id="p2-score-card" class="score-card p-4 rounded-lg w-full text-center">
            <h2 class="text-xl">Jugador 2</h2>
            <p class="text-3xl" id="score2">0</p>
        </div>
    </div>

    <!-- Contenedor del Tablero de Juego -->
    <div class="game-board-container rounded-lg overflow-hidden">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>
    
     <!-- Controles -->
    <div class="controls mt-4 p-4 rounded-lg text-center max-w-4xl w-full">
        <p><span class="text-[#39ff14]">Jugador 1:</span> WASD</p>
        <p><span class="text-[#ff14c9]">Jugador 2:</span> Flechas</p>
    </div>

    <!-- Modal de Fin de Juego -->
    <div id="gameOverModal" class="fixed inset-0 z-50 flex-col items-center justify-center hidden modal">
        <h2 id="winnerText" class="text-5xl mb-6 text-center"></h2>
        <button id="restartButton" class="restart-btn px-8 py-4 text-2xl rounded-lg font-bold">Reiniciar</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const score1Element = document.getElementById('score1');
        const score2Element = document.getElementById('score2');
        const p1ScoreCard = document.getElementById('p1-score-card');
        const p2ScoreCard = document.getElementById('p2-score-card');
        const gameOverModal = document.getElementById('gameOverModal');
        const winnerText = document.getElementById('winnerText');
        const restartButton = document.getElementById('restartButton');

        const TILE_COUNT = 30;
        const TILE_SIZE = canvas.width / TILE_COUNT;
        const GAME_SPEED = 120; // ms

        // Clase para la serpiente
        class Snake {
            constructor(x, y, color, dx, dy) {
                this.color = color;
                this.body = [{ x, y }];
                this.dx = dx; // dirección x
                this.dy = dy; // dirección y
                this.score = 0;
                this.isDead = false;
            }

            move() {
                if (this.isDead) return;
                const head = { x: this.body[0].x + this.dx, y: this.body[0].y + this.dy };
                this.body.unshift(head);
            }

            grow() {
                this.score++;
            }

            shrink() {
                 this.body.pop();
            }

            draw() {
                ctx.fillStyle = this.color;
                this.body.forEach(segment => {
                    ctx.fillRect(segment.x * TILE_SIZE, segment.y * TILE_SIZE, TILE_SIZE - 1, TILE_SIZE - 1);
                });
            }
            
            // Comprueba colisión con una lista de segmentos (otra serpiente o ella misma)
            checkCollision(segments) {
                const head = this.body[0];
                return segments.some(segment => segment.x === head.x && segment.y === head.y);
            }
        }
        
        // Clase para la Manzana
        class Apple {
            constructor() {
                this.color = '#ff3838';
                this.x = 15;
                this.y = 15;
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x * TILE_SIZE, this.y * TILE_SIZE, TILE_SIZE - 1, TILE_SIZE - 1);
            }

            randomizePosition(occupiedSegments) {
                let newPosition;
                do {
                    newPosition = {
                        x: Math.floor(Math.random() * TILE_COUNT),
                        y: Math.floor(Math.random() * TILE_COUNT)
                    };
                } while (occupiedSegments.some(segment => segment.x === newPosition.x && segment.y === newPosition.y));
                
                this.x = newPosition.x;
                this.y = newPosition.y;
            }
        }

        let snake1, snake2, apple;
        let gameOver = false;
        let gameInterval;
        
        function initializeGame() {
            snake1 = new Snake(5, 15, '#39ff14', 1, 0); // Verde Neón
            snake2 = new Snake(25, 15, '#ff14c9', -1, 0); // Rosa Neón
            apple = new Apple();
            apple.randomizePosition([...snake1.body, ...snake2.body]);
            gameOver = false;
            
            score1Element.textContent = '0';
            score2Element.textContent = '0';
            p1ScoreCard.classList.remove('active-p1');
            p2ScoreCard.classList.remove('active-p2');
            gameOverModal.classList.add('hidden');
            
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, GAME_SPEED);
        }

        function gameLoop() {
            if (gameOver) {
                clearInterval(gameInterval);
                showGameOver();
                return;
            }
            update();
            draw();
        }

        function update() {
            snake1.move();
            snake2.move();
            
            handleAppleCollision();
            handleDeathConditions();
        }
        
        function handleAppleCollision() {
            let ateApple = false;
            if (snake1.body[0].x === apple.x && snake1.body[0].y === apple.y) {
                snake1.grow();
                score1Element.textContent = snake1.score;
                ateApple = true;
            } else {
                snake1.shrink();
            }

            if (snake2.body[0].x === apple.x && snake2.body[0].y === apple.y) {
                snake2.grow();
                score2Element.textContent = snake2.score;
                ateApple = true;
            } else {
                snake2.shrink();
            }
            
            if (ateApple) {
                apple.randomizePosition([...snake1.body, ...snake2.body]);
            }
        }

        function handleDeathConditions() {
            const head1 = snake1.body[0];
            const head2 = snake2.body[0];
            
            // Colisiones con la pared
            if (head1.x < 0 || head1.x >= TILE_COUNT || head1.y < 0 || head1.y >= TILE_COUNT) snake1.isDead = true;
            if (head2.x < 0 || head2.x >= TILE_COUNT || head2.y < 0 || head2.y >= TILE_COUNT) snake2.isDead = true;
            
            // Colisiones consigo mismas
            if (snake1.checkCollision(snake1.body.slice(1))) snake1.isDead = true;
            if (snake2.checkCollision(snake2.body.slice(1))) snake2.isDead = true;

            // Colisiones entre serpientes
            const headOnHead = head1.x === head2.x && head1.y === head2.y;
            
            if (headOnHead) {
                 if(snake1.body.length > snake2.body.length){
                     snake2.isDead = true;
                 } else if (snake2.body.length > snake1.body.length){
                     snake1.isDead = true;
                 } else {
                    snake1.isDead = true;
                    snake2.isDead = true;
                 }
            } else {
                if(snake1.checkCollision(snake2.body)) snake1.isDead = true;
                if(snake2.checkCollision(snake1.body)) snake2.isDead = true;
            }
            
            if (snake1.isDead || snake2.isDead) {
                gameOver = true;
            }
        }
        
        function showGameOver() {
             let winnerMessage;
             if(snake1.isDead && snake2.isDead){
                 winnerMessage = '¡Empate!';
                 p1ScoreCard.classList.remove('active-p1');
                 p2ScoreCard.classList.remove('active-p2');
             } else if (snake1.isDead) {
                 winnerMessage = '¡Gana Jugador 2!';
                 p2ScoreCard.classList.add('active-p2');
                 p1ScoreCard.classList.remove('active-p1');
             } else {
                 winnerMessage = '¡Gana Jugador 1!';
                 p1ScoreCard.classList.add('active-p1');
                 p2ScoreCard.classList.remove('active-p2');
             }
            winnerText.textContent = winnerMessage;
            gameOverModal.classList.remove('hidden');
            gameOverModal.classList.add('flex');
        }

        function draw() {
            // Fondo
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            snake1.draw();
            snake2.draw();
            apple.draw();
        }
        
        // Control de Teclado
        document.addEventListener('keydown', e => {
            // Jugador 1: WASD
            if (e.key === 'w' && snake1.dy === 0) { snake1.dy = -1; snake1.dx = 0; }
            if (e.key === 's' && snake1.dy === 0) { snake1.dy = 1; snake1.dx = 0; }
            if (e.key === 'a' && snake1.dx === 0) { snake1.dx = -1; snake1.dy = 0; }
            if (e.key === 'd' && snake1.dx === 0) { snake1.dx = 1; snake1.dy = 0; }

            // Jugador 2: Flechas
            if (e.key === 'ArrowUp' && snake2.dy === 0) { snake2.dy = -1; snake2.dx = 0; }
            if (e.key === 'ArrowDown' && snake2.dy === 0) { snake2.dy = 1; snake2.dx = 0; }
            if (e.key === 'ArrowLeft' && snake2.dx === 0) { snake2.dx = -1; snake2.dy = 0; }
            if (e.key === 'ArrowRight' && snake2.dx === 0) { snake2.dx = 1; snake2.dy = 0; }
        });

        restartButton.addEventListener('click', initializeGame);

        // Iniciar juego
        initializeGame();
    </script>
</body>
</html>
